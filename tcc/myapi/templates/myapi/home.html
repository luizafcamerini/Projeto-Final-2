<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>PEPWatch</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body style="background-color: {{ cores.background_color }}">
    {% include 'myapi/navbar.html' %}

    {% block header %}
      {% include 'myapi/header.html' %}
    {% endblock %}

    {% block content %}
      <div class="d-flex flex-column align-items-center justify-content-center">
        <form method="post" class="d-flex flex-column align-items-center w-50">
          {% csrf_token %}
          <div class="input-group">
            <input name="input_pergunta" type="search" class="form-control rounded" />
            <button type="submit" class="btn btn-outline-primary">Busca</button>
          </div>
          <div class="form-check mt-3">
            <input type="checkbox" class="form-check-input" id="resposta_json" name="resposta_json" value="true">
            <label class="form-check-label" for="resposta_json" style="color: white;">Responder em JSON</label>
          </div>
        </form>
      </div>

      <div class="align-items-center justify-content-center w-100" 
      style="max-height: 50vh; max-width: 100vw; overflow-y: auto; overflow-x: auto; position: relative; display: flex;">
        {% if resposta %}
          <div style="max-height: 50vh; max-width: 60vw;">
            <pre style="
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 100%;
            color: {{ cores.text_color_first }};
            border: 3px solid {{ cores.text_color_second}};
            border-radius: 1rem;
            padding: 1rem;
            ">{{ resposta }}</pre>
          </div>
        {% endif %}
      </div>
    {% endblock %}

    {% block footer %}
      {% include 'myapi/footer.html' %}
    {% endblock %}
  </body>
</html>
