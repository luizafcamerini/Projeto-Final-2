<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>GovWatch</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body style="background-color: {{ cores.background_color }}">
    {% include 'myapi/navbar.html' %}

    {% block header %}
      {% include 'myapi/header.html' %}
    {% endblock %}

    {% block content %}
      <div class="d-flex align-items-center justify-content-center">
        <form method="post" class="input-group w-50">
          {% csrf_token %}
          <input name="input_pergunta" type="search" class="form-control rounded" />
          <button type="submit" class="btn btn-outline-primary">Busca</button>
        </form>
      </div>
      {% if resposta %}
        <div class="d-flex align-items-center justify-content-center w-100 my-3">
          <div class="w-70" style="color: white;">{{ resposta }}</div>
        </div>
      {% endif %}

    {% endblock %}

    {% block footer %}
      {% include 'myapi/footer.html' %}
    {% endblock %}
  </body>
</html>
