<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>GovWatch</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body style="background-color: {{ cores.background_color }}">
    {% include 'myapi/navbar.html' %}

    {% block header %}
      {% include 'myapi/header.html' %}
    {% endblock %}

    {% block content %}
      <div class="d-flex flex-column align-items-center justify-content-center">
        <form method="post" class="d-flex flex-column align-items-center w-50">
          {% csrf_token %}
          <div class="input-group">
            <input name="input_pergunta" type="search" class="form-control rounded" />
            <button type="submit" class="btn btn-outline-primary">Busca</button>
          </div>
          <div class="form-check mt-3">
            <input type="checkbox" class="form-check-input" id="resposta_json" name="resposta_json" value="true">
            <label class="form-check-label" for="resposta_json" style="color: white;">Responder em JSON</label>
          </div>
        </form>
      </div>

      <div class="d-flex align-items-center justify-content-center w-100 my-3">
        <div class="w-60" style="color: white;">
          {% if resposta %}
            {{ resposta }}
          {% endif %}
        </div>
      </div>
    {% endblock %}

    {% block footer %}
      {% include 'myapi/footer.html' %}
    {% endblock %}
  </body>
</html>
